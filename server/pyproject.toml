[project]
name = "dequ-server"
version = "0.1.0"
description = "DeQu (Decide Queue): the server that turns decisions agents are waiting on into cards for people to answer"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "mcp>=2.3", "uvicorn>=0.30"]

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.19"]

[project.scripts]
dequ = "dequ.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dequ"]
